<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deelname bevestigd — Hannelore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --indigo-dark: #2d2a4a;
      --indigo-brand: #514b91;
      --blue-soft: #e3f0fa;
      --sand-bg: #f7f4ef;
      --green: #2e7d32;
      --grey: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', Arial, sans-serif;
      background: var(--sand-bg);
      color: var(--indigo-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(45, 42, 74, 0.10);
      max-width: 540px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .logo { width: 70px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; color: var(--indigo-brand); }
    .lead { font-size: 17px; font-weight: 400; line-height: 1.5; margin-bottom: 28px; }
    .lead a { color: var(--indigo-brand); }
    .sessies {
      background: var(--blue-soft);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-bottom: 28px;
    }
    .sessies h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .sessie-item { font-size: 14px; line-height: 1.7; padding: 4px 0; }
    .sessie-item strong { font-weight: 700; }
    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { opacity: 0.92; }
    .footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #ececec; font-size: 13px; color: var(--grey); }
    .footer .naam { color: var(--indigo-dark); font-weight: 700; }
    .footer a { color: var(--indigo-brand); }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e0e0e0;
      border-top-color: var(--indigo-brand);
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .melding { font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/Brainwave.png" alt="BrainCTR" class="logo" />

    <div id="loading">
      <div class="spinner"></div>
      <p class="melding">Even geduld…</p>
    </div>

    <div id="content" class="hidden">
      <h1 id="titel"></h1>
      <p class="lead" id="boodschap"></p>
      <div id="sessies-blok" class="sessies hidden">
        <h2>Sessiedata</h2>
        <div id="sessies-lijst"></div>
      </div>
      <button id="agenda-btn" class="btn hidden" onclick="downloadICS()">📅 Voeg toe aan agenda</button>
      <div class="footer">
        <p class="naam">Hannelore</p>
        <p>ELP — psycholoog en psychotherapeut</p>
        <p style="margin-top: 8px;">✉️ <a href="mailto:info@brainctr.be?subject=Uitnodiging modulesessies">info@brainctr.be</a></p>
        <p>📞 0468 11 66 66</p>
      </div>
    </div>
  </div>

  <script>
    const API = "https://brainctrjsnodebackend-production.up.railway.app";
    const MAIL = `<a href="mailto:info@brainctr.be?subject=Uitnodiging modulesessies">info@brainctr.be</a>`;
    let sessiesData = [];
    let moduleNaam = "";

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function show(elId) { document.getElementById(elId).classList.remove("hidden"); }
    function hide(elId) { document.getElementById(elId).classList.add("hidden"); }

    function setBoodschap(html) { document.getElementById("boodschap").innerHTML = html; }

    function renderSessies(sessies) {
      const gepland = sessies.filter(s => s.datum);
      if (gepland.length === 0) return;
      const lijst = document.getElementById("sessies-lijst");
      lijst.innerHTML = gepland.map(s => `
        <div class="sessie-item">
          ${s.sessie_nummer ? `<strong>Sessie ${s.sessie_nummer}:</strong> ` : ""}
          ${s.formatted_date} om ${s.formatted_time}${s.locatie ? ` — ${s.locatie}` : ""}
        </div>
      `).join("");
      show("sessies-blok");
      show("agenda-btn");
    }

    function downloadICS() {
      const gepland = sessiesData.filter(s => s.datum);
      if (gepland.length === 0) return;

      let ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//BrainCTR//Modules//NL",
        "CALSCALE:GREGORIAN"
      ];

      gepland.forEach((s, i) => {
        const [y, m, d] = s.datum.split("-").map(Number);
        const [hh, mm] = (s.tijd || "10:00:00").split(":").map(Number);
        const start = new Date(y, m - 1, d, hh, mm);
        const eind = new Date(start.getTime() + 90 * 60000);

        const fmt = dt =>
          `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;

        ics.push(
          "BEGIN:VEVENT",
          `UID:${Date.now()}-${i}@brainctr`,
          `DTSTART:${fmt(start)}`,
          `DTEND:${fmt(eind)}`,
          `SUMMARY:${moduleNaam}${s.sessie_nummer ? ` - sessie ${s.sessie_nummer}` : ""}`,
          `LOCATION:${(s.locatie || "").replace(/,/g, "\\,")}`,
          "END:VEVENT"
        );
      });

      ics.push("END:VCALENDAR");

      const blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "modules-sessies.ics";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function init() {
      const token = getToken();
      if (!token) {
        hide("loading");
        document.getElementById("titel").textContent = "Ongeldige link";
        setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        show("content");
        return;
      }

      try {
        const res = await fetch(`${API}/api/bevestig/${token}`);
        const data = await res.json();

        hide("loading");
        show("content");

        const voornaam = data.voornaam ? `, ${data.voornaam}` : "";
        moduleNaam = data.module_naam || "de module";
        sessiesData = data.sessies || [];

        if (res.ok && data.success) {
          document.getElementById("titel").textContent = "Deelname bevestigd";
          setBoodschap(`Fijn dat je erbij bent${voornaam}. We verwelkomen je graag voor ${moduleNaam}.`);
          renderSessies(sessiesData);
        } else if (res.status === 409) {
          if (data.status === "bevestigd") {
            document.getElementById("titel").textContent = "Al bevestigd";
            setBoodschap(`Je deelname aan ${moduleNaam} was al bevestigd${voornaam}. Tot binnenkort!`);
            renderSessies(sessiesData);
          } else {
            document.getElementById("titel").textContent = "Al gereageerd";
            setBoodschap(`Je hebt al gereageerd op deze uitnodiging${voornaam}. Heb je een vraag? Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
          }
        } else if (res.status === 410) {
          document.getElementById("titel").textContent = "Termijn verlopen";
          setBoodschap(`De bevestigingstermijn voor ${moduleNaam} is verstreken${voornaam}. Wil je toch nog deelnemen? Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        } else {
          document.getElementById("titel").textContent = "Ongeldige link";
          setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        }
      } catch (err) {
        hide("loading");
        show("content");
        document.getElementById("titel").textContent = "Er ging iets mis";
        setBoodschap(`Probeer het later opnieuw, of mail gerust naar ${MAIL}.`);
      }
    }

    init();
  </script>
</body>
</html>
