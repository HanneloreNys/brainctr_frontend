<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deelname uitgesteld — Hannelore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --indigo-dark: #2d2a4a;
      --indigo-brand: #514b91;
      --blue-soft: #e3f0fa;
      --sand-bg: #f7f4ef;
      --grey: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', Arial, sans-serif;
      background: var(--sand-bg);
      color: var(--indigo-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(45, 42, 74, 0.10);
      max-width: 560px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .logo { width: 70px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; color: var(--indigo-brand); }
    .lead { font-size: 17px; font-weight: 400; line-height: 1.5; margin-bottom: 28px; }
    .lead a { color: var(--indigo-brand); }
    .form-intro { font-size: 15px; line-height: 1.5; margin-bottom: 20px; text-align: left; }
    .form-blok { text-align: left; margin-bottom: 24px; }
    .form-blok > label.kop {
      display: block; font-weight: 700; font-size: 15px; margin-bottom: 10px;
    }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .check {
      display: flex; align-items: center; font-size: 14px; font-weight: 400; cursor: pointer;
    }
    .check input { margin-right: 8px; }
    .btn {
      display: inline-block;
      background: var(--indigo-brand);
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #ececec; font-size: 13px; color: var(--grey); }
    .footer .naam { color: var(--indigo-dark); font-weight: 700; }
    .footer a { color: var(--indigo-brand); }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e0e0e0;
      border-top-color: var(--indigo-brand);
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .melding { font-size: 16px; line-height: 1.5; }
    @media (max-width: 480px) { .checks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <img src="/Brainwave.png" alt="BrainCTR" class="logo" />

    <div id="loading">
      <div class="spinner"></div>
      <p class="melding">Even geduld…</p>
    </div>

    <div id="content" class="hidden">
      <h1 id="titel"></h1>
      <p class="lead" id="boodschap"></p>

      <div id="voorkeur-form" class="hidden">
        <p class="form-intro">
          Help ons een volgende reeks te plannen. Wanneer wil jij deelnemen? (optioneel)
        </p>

        <div class="form-blok">
          <label class="kop">Voorkeurmomenten</label>
          <div class="checks" id="momenten-checks"></div>
        </div>

        <div class="form-blok">
          <label class="kop">Voorkeurlocatie</label>
          <div class="checks">
            <label class="check"><input type="checkbox" name="locatie" value="Diest" /> Diest</label>
            <label class="check"><input type="checkbox" name="locatie" value="Beringen" /> Beringen</label>
            <label class="check"><input type="checkbox" name="locatie" value="Geen voorkeur" /> Geen voorkeur</label>
          </div>
        </div>

        <button id="opslaan-btn" class="btn" onclick="opslaan()">Voorkeuren doorgeven</button>
      </div>

      <div class="footer">
        <p class="naam">Hannelore</p>
        <p>ELP — psycholoog en psychotherapeut</p>
        <p style="margin-top: 8px;">✉️ <a href="mailto:info@brainctr.be?subject=Uitnodiging modulesessies">info@brainctr.be</a></p>
        <p>📞 0468 11 66 66</p>
      </div>
    </div>
  </div>

  <script>
    const API = "https://brainctrjsnodebackend-production.up.railway.app";
    const MAIL = `<a href="mailto:info@brainctr.be?subject=Uitnodiging modulesessies">info@brainctr.be</a>`;

    const MOMENTEN = [
      ["ma_vm", "Maandag voormiddag"], ["ma_nm", "Maandag namiddag"], ["ma_av", "Maandag avond"],
      ["di_vm", "Dinsdag voormiddag"], ["di_nm", "Dinsdag namiddag"], ["di_av", "Dinsdag avond"],
      ["wo_vm", "Woensdag voormiddag"], ["wo_nm", "Woensdag namiddag"], ["wo_av", "Woensdag avond"],
      ["do_vm", "Donderdag voormiddag"], ["do_nm", "Donderdag namiddag"], ["do_av", "Donderdag avond"],
      ["vr_vm", "Vrijdag voormiddag"], ["vr_nm", "Vrijdag namiddag"], ["vr_av", "Vrijdag avond"],
      ["za_vm", "Zaterdag voormiddag"], ["za_nm", "Zaterdag namiddag"]
    ];

    function getToken() {
      return new URLSearchParams(window.location.search).get("token");
    }
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }
    function setBoodschap(html) { document.getElementById("boodschap").innerHTML = html; }

    function buildMomenten() {
      document.getElementById("momenten-checks").innerHTML = MOMENTEN.map(
        ([val, label]) => `<label class="check"><input type="checkbox" name="moment" value="${val}" /> ${label}</label>`
      ).join("");
    }

    async function opslaan() {
      const token = getToken();
      const momenten = [...document.querySelectorAll('input[name="moment"]:checked')].map(c => c.value);
      const locaties = [...document.querySelectorAll('input[name="locatie"]:checked')].map(c => c.value);

      const btn = document.getElementById("opslaan-btn");
      btn.disabled = true;
      btn.textContent = "Bezig…";

      try {
        await fetch(`${API}/api/uitstel/${token}/voorkeuren`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            voorkeur_momenten: momenten.join(","),
            voorkeur_locatie: locaties.join(",")
          })
        });
        hide("voorkeur-form");
        document.getElementById("titel").textContent = "Bedankt!";
        setBoodschap("Je voorkeuren zijn doorgegeven. We houden er rekening mee bij een volgende reeks.");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Voorkeuren doorgeven";
        alert("Er ging iets mis. Probeer het later opnieuw.");
      }
    }

    async function init() {
      const token = getToken();
      buildMomenten();

      if (!token) {
        hide("loading");
        document.getElementById("titel").textContent = "Ongeldige link";
        setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        show("content");
        return;
      }

      try {
        const res = await fetch(`${API}/api/uitstel/${token}`);
        const data = await res.json();

        hide("loading");
        show("content");

        const voornaam = data.voornaam ? `, ${data.voornaam}` : "";
        const moduleNaam = data.module_naam || "de module";

        if (res.ok && data.success) {
          document.getElementById("titel").textContent = "Deelname uitgesteld";
          setBoodschap(`In orde${voornaam}. Je wordt opnieuw uitgenodigd zodra er een volgende reeks van ${moduleNaam} gepland is.`);
          show("voorkeur-form");
        } else if (res.status === 409) {
          document.getElementById("titel").textContent = "Al gereageerd";
          setBoodschap(`Je hebt al gereageerd op deze uitnodiging${voornaam}. Heb je een vraag? Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        } else if (res.status === 410) {
          document.getElementById("titel").textContent = "Termijn verlopen";
          setBoodschap(`De termijn voor deze uitnodiging is verstreken${voornaam}. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        } else {
          document.getElementById("titel").textContent = "Ongeldige link";
          setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        }
      } catch (err) {
        hide("loading");
        show("content");
        document.getElementById("titel").textContent = "Er ging iets mis";
        setBoodschap(`Probeer het later opnieuw, of mail gerust naar ${MAIL}.`);
      }
    }

    init();
  </script>
</body>
</html>
