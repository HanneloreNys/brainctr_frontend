<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Individuele begeleiding — Hannelore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --indigo-dark: #2d2a4a;
      --indigo-brand: #514b91;
      --sand-bg: #f7f4ef;
      --green: #2e7d32;
      --grey: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', Arial, sans-serif;
      background: var(--sand-bg);
      color: var(--indigo-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(45, 42, 74, 0.10);
      max-width: 540px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .logo { width: 70px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; color: var(--indigo-brand); }
    .lead { font-size: 17px; font-weight: 400; line-height: 1.5; margin-bottom: 28px; }
    .lead a { color: var(--indigo-brand); }
    .footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #ececec; font-size: 13px; color: var(--grey); }
    .footer .naam { color: var(--indigo-dark); font-weight: 700; }
    .footer a { color: var(--indigo-brand); }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e0e0e0;
      border-top-color: var(--indigo-brand);
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .melding { font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/Brainwave.png" alt="BrainCTR" class="logo" />

    <div id="loading">
      <div class="spinner"></div>
      <p class="melding">Even geduld…</p>
    </div>

    <div id="content" class="hidden">
      <h1 id="titel"></h1>
      <p class="lead" id="boodschap"></p>
      <div class="footer">
        <p class="naam">Hannelore</p>
        <p>ELP — psycholoog en psychotherapeut</p>
        <p style="margin-top: 8px;">✉️ <a href="mailto:info@brainctr.be?subject=Individuele begeleiding">info@brainctr.be</a></p>
        <p>📞 0468 11 66 66</p>
      </div>
    </div>
  </div>

  <script>
    const API = "https://brainctrjsnodebackend-production.up.railway.app";
    const MAIL = `<a href="mailto:info@brainctr.be?subject=Individuele begeleiding">info@brainctr.be</a>`;

    function getToken() {
      return new URLSearchParams(window.location.search).get("token");
    }
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }
    function setBoodschap(html) { document.getElementById("boodschap").innerHTML = html; }

    async function init() {
      const token = getToken();
      if (!token) {
        hide("loading");
        document.getElementById("titel").textContent = "Ongeldige link";
        setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        show("content");
        return;
      }

      try {
        const res = await fetch(`${API}/api/individuele-interesse/${token}/ja`);
        const data = await res.json();

        hide("loading");
        show("content");

        const voornaam = data.voornaam ? `, ${data.voornaam}` : "";

        if (res.ok && data.success) {
          document.getElementById("titel").textContent = "Fijn!";
          setBoodschap(`Je staat nu op de wachtlijst voor individuele begeleiding${voornaam}. We nemen contact op zodra er een plek beschikbaar is.`);
        } else if (res.status === 410) {
          document.getElementById("titel").textContent = "Termijn verlopen";
          setBoodschap(`De termijn om te reageren is verstreken${voornaam}. Wil je toch nog individuele begeleiding? Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        } else {
          document.getElementById("titel").textContent = "Ongeldige link";
          setBoodschap(`Deze link is niet geldig. Mail gerust naar ${MAIL} of bel 0468 11 66 66.`);
        }
      } catch (err) {
        hide("loading");
        show("content");
        document.getElementById("titel").textContent = "Er ging iets mis";
        setBoodschap(`Probeer het later opnieuw, of mail gerust naar ${MAIL}.`);
      }
    }

    init();
  </script>
</body>
</html>
